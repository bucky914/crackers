<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Your Cart | Sparkle Crackers</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <div class="logo"><span class="emoji">🎆</span> Sparkle Crackers</div>
    <nav class="site-nav">
      <a href="index.html">Home</a>
      <a href="cart.html" class="cart-link">🛒 Cart <span id="cartCount">0</span></a>
    </nav>
  </div>
</header>

<main>
  <h2 class="section-title">Your Cart</h2>
  <div id="cartContainer"></div>
</main>

<footer>
  🎆 Sparkle Crackers &copy; 2026 — Sample demo website. No real payment or delivery.
</footer>

<script src="products.js"></script>
<script src="cart.js"></script>
<script src="ui.js"></script>
<script>
  const container = document.getElementById("cartContainer");

  function renderCart() {
    const items = getCartDetails();

    if (items.length === 0) {
      container.innerHTML = `
        <div class="empty-state">
          <span class="emoji">🛒</span>
          Your cart is empty.
          <div style="margin-top:16px;">
            <a href="index.html" class="btn btn-primary">Browse Products</a>
          </div>
        </div>
      `;
      return;
    }

    let html = items.map(item => `
      <div class="cart-item" id="cart-row-${item.product.id}">
        <img src="${item.product.img}" alt="${item.product.name}" />
        <div class="cart-item-info">
          <div class="cart-item-name">${item.product.name}</div>
          <div class="cart-item-price">${formatRupees(item.product.price)} each</div>
          <div class="qty-control">
            <button type="button" onclick="updateQty(${item.product.id}, -1)">−</button>
            <input type="number" min="1" value="${item.qty}" id="cart-qty-${item.product.id}"
                   onchange="setQtyDirect(${item.product.id}, this.value)" />
            <button type="button" onclick="updateQty(${item.product.id}, 1)">+</button>
          </div>
        </div>
        <div class="cart-item-actions">
          <div class="cart-item-total">${formatRupees(item.lineTotal)}</div>
          <button class="remove-link" onclick="removeItem(${item.product.id})">Remove</button>
        </div>
      </div>
    `).join("");

    const total = getCartTotal();

    html += `
      <div class="summary-box">
        <div class="summary-row">
          <span>Items (${getCartCount()})</span>
          <span>${formatRupees(total)}</span>
        </div>
        <div class="summary-row total">
          <span>Subtotal</span>
          <span>${formatRupees(total)}</span>
        </div>
        <a href="checkout.html" class="btn btn-primary btn-block" style="margin-top:14px; display:block; text-align:center;">Proceed to Checkout</a>
        <button class="btn btn-secondary btn-block" style="margin-top:8px;" onclick="handleClear()">Clear Cart</button>
      </div>
    `;

    container.innerHTML = html;
  }

  function updateQty(id, delta) {
    const cart = getCart();
    const newQty = (cart[id] || 1) + delta;
    setCartQty(id, newQty);
    renderCart();
  }

  function setQtyDirect(id, value) {
    setCartQty(id, value);
    renderCart();
  }

  function removeItem(id) {
    removeFromCart(id);
    renderCart();
    showToast("Item removed");
  }

  function handleClear() {
    if (confirm("Clear all items from cart?")) {
      clearCart();
      renderCart();
    }
  }

  renderCart();
</script>
</body>
</html>
